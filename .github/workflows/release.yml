name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run release:check
      - name: Verify tag version
        shell: bash
        run: |
          version="$(node -p "require('./manifest.json').version")"
          test "${GITHUB_REF_NAME}" = "${version}"
      - name: Verify standard plugin assets
        shell: bash
        run: |
          test "$(find build/obsidian/asset-track -type f | wc -l)" -eq 3
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: "build/obsidian/asset-track/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          build/obsidian/asset-track/main.js
          build/obsidian/asset-track/manifest.json
          build/obsidian/asset-track/styles.css
          --verify-tag --generate-notes
