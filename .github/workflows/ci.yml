name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Run unit and integration tests
        run: npm test -- --exclude tests/plugin/sqliteSpike.test.ts
      - name: Run bounded read-window performance guard
        run: npm run test:perf
      - run: npm run build
      - run: npm run release:check
