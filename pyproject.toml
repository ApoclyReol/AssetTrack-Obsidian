[project]
name = "asset-track"
version = "3.2.0"
description = "个人自动化记账系统"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.9",
    "pandas>=2.0.0",
    "loguru>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pyinstaller>=6.0.0",
]

[tool.basedpyright]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = [
    "tests/python",
]
pythonpath = [
    "backend",
]
