<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Track 更新审查</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f3f7;color:#272530;font:15px/1.6 system-ui,sans-serif}main{max-width:1060px;margin:40px auto;padding:20px}h1{font-size:24px}h2{font-size:20px;margin:0 0 20px}h3{font-size:15px;margin:0 0 16px}section{background:white;border:1px solid #ddd9e5;border-radius:16px;padding:28px;margin:24px 0}.columns{display:grid;grid-template-columns:1fr 1fr;gap:30px}fieldset{border:0;margin:0;padding:0;min-width:0}label{display:block;margin:12px 0}input:not([type=checkbox]),select{display:block;width:100%;border:1px solid #d9d5e1;border-radius:7px;padding:10px;font:inherit;background:white;color:inherit}input[type=checkbox]{vertical-align:middle;margin:0 9px 0 0}button{border:0;border-radius:7px;padding:10px 18px;font:inherit;cursor:pointer;background:#eeeaf3}button.primary{background:#8251d9;color:white}.actions{display:flex;justify-content:flex-end;gap:10px;border-top:1px solid #eee;margin-top:24px;padding-top:18px}small{color:#746e80}.help{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;padding:0;font-size:12px}.conflict{padding:12px;background:#fff6eb;border-radius:7px;margin-top:14px}.conflict:empty{display:none}details{margin:16px 0}dl{display:grid;grid-template-columns:90px 1fr;gap:10px}dd{margin:0}.tabs{display:flex;gap:10px;margin-bottom:18px}.mock-table{width:100%;border-collapse:collapse}.mock-table td,.mock-table th{text-align:left;border-bottom:1px solid #eee;padding:12px}.compact{max-width:480px}.hidden{display:none}@media(max-width:650px){.columns{grid-template-columns:1fr}main{margin:0}.mock-table{font-size:13px}}
</style><main><h1>本轮更新 · 界面审查</h1><p>示例数据可点击演示，重点核对字段安排与操作含义。</p>
<section><h2>新建规则</h2><div class="columns"><fieldset><h3>匹配条件 <button class="help" title="商品、交易对手或两者共同匹配。金额可进一步限定适用范围。">?</button></h3><label>收支类型<select><option>支出</option><option>收入</option><option>代付</option></select></label><label>交易对手<input value="示例平台"></label><label>商品<input id="product" value="饮用水"></label><details><summary>金额条件</summary><label>金额范围<select><option>不限金额</option><option>低于 2 元</option><option>2～50 元</option></select></label></details><small>按交易对手与商品共同匹配</small></fieldset><fieldset><h3>处理结果</h3><label>目标分类<select id="category"><option>餐饮基础</option><option>日常购物</option></select></label><details><summary>重写商品与交易对手</summary><label>商品<input id="rewrite" placeholder="保留原值"></label><label>交易对手<input placeholder="保留原值"></label><label>留空处理<select><option>保留原值</option><option>清空原值</option></select></label></details><dl><dt>交易对手</dt><dd>示例平台</dd><dt>商品</dt><dd id="after">饮用水</dd><dt>分类</dt><dd id="after-category">餐饮基础</dd></dl><div id="conflict" class="conflict"></div></fieldset></div><div class="actions"><button onclick="document.getElementById('conflict').textContent='与规则 #22 冲突 · 示例平台 / 饮用水 / 不限金额 → 日常购物。请调整匹配条件或编辑已有规则。'">演示规则冲突</button><button>取消</button><button class="primary">保存规则</button></div></section>
<section class="compact"><h2>合并此组</h2><label><input type="checkbox" checked>保留带标签项</label><div class="actions"><button>取消合并</button><button class="primary">合并到流水草稿</button></div></section>
<section class="compact"><h2>创建月份</h2><label>月份<input type="month" value="2026-10"></label><div class="actions"><button>取消</button><button class="primary">创建月份</button></div></section>
<section><h2>分类设计</h2><nav class="tabs"><button class="primary">分类</button><button>属性定义</button><button>标签定义</button></nav><table class="mock-table"><tr><th>分类</th><th>收支</th><th>属性</th><th>操作</th></tr><tr><td>餐饮基础</td><td>支出</td><td>必要 · 日常</td><td><button>编辑</button> <button>迁移</button> <button>更多</button></td></tr></table></section>
</main><script>const product=document.getElementById('product'),rewrite=document.getElementById('rewrite'),category=document.getElementById('category');function update(){document.getElementById('after').textContent=rewrite.value||product.value||'—';document.getElementById('after-category').textContent=category.value}product.oninput=update;rewrite.oninput=update;category.onchange=update;</script></html>
